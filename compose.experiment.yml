# Local experiment overrides for the NANDA Index (vendor/nanda-index-v2 stays unmodified).
#
# Usage (from the repo root):
#   docker compose -p nanda-index-v2 \
#     -f vendor/nanda-index-v2/docker-compose.yml -f compose.experiment.yml up -d
#
# The default limits protect the public index from abuse. In the local experiment all
# agents share one IP (localhost), so they are raised. Nothing else is changed.

services:
  server:
    environment:
      AUTH_RATE_LIMIT_MAX: "1000"        # default 10 per minute and IP
      ORG_WRITE_RATE_LIMIT_MAX: "1000"   # default 30 per hour and IP
      SEARCH_RATE_LIMIT_MAX: "10000"     # default 30 per minute and IP
      PUBLIC_RATE_LIMIT_MAX: "10000"     # default 120 per minute and IP

  # Static card host for the agent cards and AgentFacts (world/public, generated by
  # world/make_agentfacts.py). NANDA's SMB pattern: one host, one path per agent.
  # Replaced by live bank agents later. Relative paths resolve from the first compose
  # file's directory (vendor/nanda-index-v2), hence ../../.
  cardhost:
    image: nginx:1.29-alpine
    ports:
      - "8100:80"
    volumes:
      - ../../world/public:/usr/share/nginx/html:ro
    restart: unless-stopped
